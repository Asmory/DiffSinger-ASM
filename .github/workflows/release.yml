name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS: -O3 -Wall -Wextra -std=c11 -mavx2 -mfma
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run release gates
        run: |
          make -j2 engine-check
          make -j2 test
          make -j2 m35-check m38-check m58-check

      - name: Build release archive
        run: make -j2 package VERSION="$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.tar.gz
          release/*.sha256
          --verify-tag
          --generate-notes
          --title "DiffSinger-ASM $GITHUB_REF_NAME"
